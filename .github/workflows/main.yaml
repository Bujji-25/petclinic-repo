name: CI/CD PIPELINE TO BUILD AND DEPLOY TO TOMCAT

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java
      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # 3. Check Java and Maven versions
      - name: 🔍 Check Java and Maven
        run: |
          java -version
          mvn -version

      # 4. Verify Sonar configuration
      - name: 🔍 Check Sonar Configuration
        run: |
          echo "===== Current directory ====="
          pwd

          echo "===== POM files ====="
          find . -name pom.xml -print

          echo "===== Sonar plugin in POM ====="
          grep -n -A5 -B2 "sonar-maven-plugin" pom.xml || true

          echo "===== Check workflow files for old sonar command ====="
          grep -R "sonar:sonar" .github/workflows || true

      # 5. Validate Maven project
      - name: Validate with Maven
        run: mvn validate

      # 6. Compile project
      - name: Compile with Maven
        run: mvn compile

      # 7. Run tests
      - name: Test with Maven
        run: mvn test

      # 8. Package WAR
      - name: Package with Maven
        run: mvn clean package -DskipTests

      # 9. Verify WAR file
      - name: 📦 Verify WAR file
        run: |
          echo "===== Target directory ====="
          ls -lh target/

          echo "===== WAR file ====="
          ls -lh target/*.war

      # 10. SonarQube Analysis
      - name: 🔎 SonarQube Analysis
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      # 11. Deploy WAR to Nexus
      - name: 📤 Deploy WAR to Nexus
        run: |
          mvn deploy \
            -DskipTests \
            -DaltDeploymentRepository=nexus::default::${{ secrets.NEXUS_URL }}/repository/maven-releases/

      # 12. Deploy WAR to Tomcat
      - name: 🚀 Deploy WAR to Tomcat
        run: |
          curl --upload-file target/*.war \
            -u "${{ secrets.TOMCAT_USERNAME }}:${{ secrets.TOMCAT_PASSWORD }}" \
            "${{ secrets.TOMCAT_URL }}/manager/text/deploy?path=/train-ticket&update=true"
